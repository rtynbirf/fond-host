# АВТОМАТ ЗАВИСИМОСТЕЙ (2026-11-16): экосистема github-actions, weekly, группировка.
# Пины экшенов — полные SHA40 из действующих зелёных прогонов дома (С128).
version: 2
updates:
  - package-ecosystem:
    open-pull-requests-limit: 0  # версионный шум Dependabot выключен (чистка аккаунта 2026-11-18) "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
